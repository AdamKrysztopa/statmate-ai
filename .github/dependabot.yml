# Security updates only, batched.
#
# `open-pull-requests-limit: 0` disables routine *version-update* pull requests for an
# ecosystem. Dependabot *security* updates are controlled separately (by the repository's
# automated-security-fixes setting) and are unaffected — so vulnerabilities still raise a
# PR, while cosmetic "bump X from 1.2 to 1.3" churn does not.
#
# The `groups` blocks apply to security updates, so a batch of advisories lands as one
# pull request rather than one per package. With 191 alerts open at once this was the
# difference between a single notification and dozens.
#
# To re-enable routine updates for an ecosystem, raise its limit.
version: 2

updates:
  # Python dependencies (uv.lock / pyproject.toml)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  # React frontend (frontend/package-lock.json)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # GitHub Actions used by CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
