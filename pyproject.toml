[project]
name = "statmate-ai"
version = "0.1.0"
description = "AI-assisted statistical analysis tool for clinical research"
readme = "README.md"
authors = [{ name = "Adam Krysztopa", email = "adam_krysztopa@mechai.pl" }]
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "weasyprint>=68.0",
    "python-docx>=1.1.2",
    "cairosvg>=2.9.0",
    # API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.21",
    # UI
    "streamlit>=1.45.0",
    # AI/LLM - Core
    "pydantic-ai>=2.0.0",
    "langgraph>=0.4.0",
    # AI/LLM - Model Providers (Pydantic AI compatible)
    # OpenAI (default)
    "openai>=1.0.0",
    # Anthropic
    "anthropic>=0.18.0",
    # Google Gemini
    "google-generativeai>=0.3.0",
    # Groq
    "groq>=0.4.0",
    # Ollama (local models)
    "ollama>=0.1.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "aiosqlite>=0.19.0",
    # Task Scheduling
    "apscheduler>=3.10.0",
    # Storage
    "pyarrow>=21.0.0",
    "openpyxl>=3.1.0",
    # HTTP Client
    "httpx>=0.28.1",
    # Security
    "pyjwt>=2.12.0",
    "passlib[argon2]>=1.7.4",
    "cryptography>=48.0.1",
    "email-validator>=2.1.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "joblib>=1.4.2",
    "grandalf>=0.8",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.0.291",
    "pyright>=1.1.320,<1.1.412",
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.0.0",
    "locust>=2.29.0",
]

[tool.uv]
default-groups = []
prerelease = "if-necessary-or-explicit"

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "C", "N", "Q", "B", "I"]
ignore = []
extend-select = ["ANN", "ARG", "D", "PIE", "PT", "RET", "S", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
ignore-names = ["X*"]

[tool.pyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8.3.5", "locust>=2.29.0"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
