[project]
name = "statmate-ai"
version = "0.1.0"
description = "AI-assisted statistical analysis tool for clinical research"
readme = "README.md"
authors = [{ name = "Adam Krysztopa", email = "adam_krysztopa@mechai.pl" }]
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",

    # UI
    "streamlit>=1.28.0",

    # AI/LLM - Core
    "pydantic-ai>=0.0.1",
    "langgraph>=0.0.1",

    # AI/LLM - Model Providers (Pydantic AI compatible)
    # OpenAI (default)
    "openai>=1.0.0",
    # Anthropic
    "anthropic>=0.18.0",
    # Google Gemini
    "google-generativeai>=0.3.0",
    # Groq
    "groq>=0.4.0",
    # Ollama (local models)
    "ollama>=0.1.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "aiosqlite>=0.19.0",

    # Task Scheduling
    "apscheduler>=3.10.0",

    # Storage
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",

    # HTTP Client
    "httpx>=0.25.0",

    # Security
    "pyjwt>=2.10.0",
    "passlib[argon2]>=1.7.4",
    "cryptography>=42.0.0",
    "email-validator>=2.1.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "joblib>=1.4.2",
    "grandalf>=0.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.0.289,<0.0.290",
    "pyright>=1.1.320,<1.1.321",
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.0.0",
]

[tool.uv]
default-groups = []
prerelease = "if-necessary-or-explicit"

[tool.ruff]
select = ["E", "F", "W", "C", "N", "Q", "B", "I"]
ignore = []
line-length = 120
extend-select = ["ANN", "ARG", "D", "PIE", "PT", "RET", "S", "UP"]
fix = true


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
ignore-names = ["X*"]

[tool.pyright]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
